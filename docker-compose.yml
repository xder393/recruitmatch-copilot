services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recruitmatch
      POSTGRES_USER: recruitmatch
      POSTGRES_PASSWORD: recruitmatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitmatch -d recruitmatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  recruitmatch-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://recruitmatch:recruitmatch@postgres:5432/recruitmatch
      TASK_MODE: celery
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      python scripts/seed_job_templates.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data:/app/data              # 上传的资料 + 索引 + 会话
      - hf-cache:/root/.cache/huggingface   # embedding 模型缓存
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  recruitmatch-worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://recruitmatch:recruitmatch@postgres:5432/recruitmatch
      ARTIFACT_DIR: /app/data/resumes
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  hf-cache:
