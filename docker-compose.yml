x-runtime-build: &runtime-build
  context: .
  target: runtime

x-test-build: &test-build
  context: .
  target: test

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://recruitmatch:recruitmatch@postgres:5432/recruitmatch
  ARTIFACT_DIR: /app/data/resumes
  KNOWLEDGE_ARTIFACT_DIR: /app/data/knowledge
  CELERY_BROKER_URL: redis://redis:6379/0
  AI_ENABLED: ${AI_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
  OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recruitmatch
      POSTGRES_USER: recruitmatch
      POSTGRES_PASSWORD: recruitmatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitmatch -d recruitmatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  bootstrap:
    image: recruitmatch-app
    build: *runtime-build
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://recruitmatch:recruitmatch@postgres:5432/recruitmatch
    depends_on:
      postgres:
        condition: service_healthy
    command: python scripts/bootstrap.py
    restart: "no"

  api:
    image: recruitmatch-app
    build: *runtime-build
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *app-environment
      TASK_MODE: celery
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - app-data:/app/data
      - hf-cache-v2:/home/recruitmatch/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    image: recruitmatch-app
    build: *runtime-build
    env_file:
      - .env
    environment: *app-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - app-data:/app/data
      - hf-cache-v2:/home/recruitmatch/.cache/huggingface
    healthcheck:
      disable: true
    restart: unless-stopped

  test-unit:
    image: recruitmatch-app-test
    build: *test-build
    profiles: ["test"]
    environment:
      DATABASE_URL: sqlite:////tmp/recruitmatch-test.db
      ARTIFACT_DIR: /tmp/recruitmatch-resumes
      KNOWLEDGE_ARTIFACT_DIR: /tmp/recruitmatch-knowledge
      TASK_MODE: inline
      AI_ENABLED: "false"
    command: pytest -q

  test-integration:
    image: recruitmatch-app-test
    build: *test-build
    profiles: ["test"]
    env_file:
      - .env
    environment:
      <<: *app-environment
      TASK_MODE: celery
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: pytest -q

volumes:
  postgres-data:
  redis-data:
  app-data:
  hf-cache-v2:
