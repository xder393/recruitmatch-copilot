services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recruitmatch
      POSTGRES_USER: recruitmatch
      POSTGRES_PASSWORD: recruitmatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitmatch -d recruitmatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  recruitmatch-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://recruitmatch:recruitmatch@postgres:5432/recruitmatch
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      python scripts/seed_job_templates.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data:/app/data              # 上传的资料 + 索引 + 会话
      - hf-cache:/root/.cache/huggingface   # embedding 模型缓存
    restart: unless-stopped

volumes:
  postgres-data:
  hf-cache:
