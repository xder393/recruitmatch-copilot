x-runtime-build: &runtime-build
  context: .
  target: runtime

x-test-build: &test-build
  context: .
  target: test

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://recruitmatch:recruitmatch@postgres:5432/recruitmatch
  CELERY_BROKER_URL: redis://redis:6379/0
  PROCESSING_LEASE_SECONDS: ${PROCESSING_LEASE_SECONDS:-300}
  PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-5}
  TASK_SOFT_TIME_LIMIT: ${TASK_SOFT_TIME_LIMIT:-540}
  TASK_HARD_TIME_LIMIT: ${TASK_HARD_TIME_LIMIT:-600}
  REDIS_VISIBILITY_TIMEOUT: ${REDIS_VISIBILITY_TIMEOUT:-900}
  RETRY_SHORT_SECONDS: ${RETRY_SHORT_SECONDS:-30}
  RETRY_LONG_SECONDS: ${RETRY_LONG_SECONDS:-300}
  RETRY_SAFETY_MARGIN_SECONDS: ${RETRY_SAFETY_MARGIN_SECONDS:-30}
  AI_ENABLED: ${AI_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
  OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
  HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-before-production}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-openai-compatible}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
  MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-20}
  MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-1}
  MODEL_INPUT_COST_PER_MILLION: ${MODEL_INPUT_COST_PER_MILLION:-0}
  MODEL_OUTPUT_COST_PER_MILLION: ${MODEL_OUTPUT_COST_PER_MILLION:-0}
  RESUME_PROMPT_VERSION: ${RESUME_PROMPT_VERSION:-resume-extract-v1}
  EXPLANATION_PROMPT_VERSION: ${EXPLANATION_PROMPT_VERSION:-match-explanation-v1}
  RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-6}
  RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.35}
  MAX_EVIDENCE_CHARACTERS: ${MAX_EVIDENCE_CHARACTERS:-8000}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-recruitmatch-app-demo}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-demo-app-password-change-me}

services:
  minio:
    image: ${COMPOSE_PROJECT_NAME:-recruitmatch}-minio:2025-10-15
    build:
      context: ops/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-recruitmatch-root-demo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-demo-root-password-change-me}
      MINIO_BROWSER: "off"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-recruitmatch-root-demo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-demo-root-password-change-me}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-recruitmatch-app-demo}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-demo-app-password-change-me}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./ops/minio:/init:ro
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: recruitmatch
      POSTGRES_USER: recruitmatch
      POSTGRES_PASSWORD: recruitmatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitmatch -d recruitmatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  bootstrap:
    image: ${COMPOSE_PROJECT_NAME:-recruitmatch}-app
    build: *runtime-build
    environment:
      DATABASE_URL: postgresql+psycopg://recruitmatch:recruitmatch@postgres:5432/recruitmatch
    depends_on:
      postgres:
        condition: service_healthy
    command: python scripts/bootstrap.py
    healthcheck:
      disable: true
    restart: "no"

  api:
    image: ${COMPOSE_PROJECT_NAME:-recruitmatch}-app
    build: *runtime-build
    ports:
      - "8000:8000"
    environment:
      <<: *app-environment
      TASK_MODE: celery
    depends_on:
      minio-init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - hf-cache-v2:/home/recruitmatch/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=8)"]
      interval: 15s
      timeout: 9s
      retries: 5
    restart: unless-stopped

  worker:
    image: ${COMPOSE_PROJECT_NAME:-recruitmatch}-app
    build: *runtime-build
    environment: *app-environment
    depends_on:
      minio-init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - hf-cache-v2:/home/recruitmatch/.cache/huggingface
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    image: ${COMPOSE_PROJECT_NAME:-recruitmatch}-app
    build: *runtime-build
    environment: *app-environment
    depends_on:
      minio-init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app beat --scheduler app.tasks.beat:RecoveryScheduler --loglevel=WARNING
    volumes:
      - hf-cache-v2:/home/recruitmatch/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from app.operations.heartbeats import OperationsHeartbeats; assert OperationsHeartbeats(os.environ['CELERY_BROKER_URL']).snapshot()['beat'] == 'fresh'"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  test-unit:
    image: ${COMPOSE_PROJECT_NAME:-recruitmatch}-app-test
    build: *test-build
    profiles: ["test"]
    environment:
      DATABASE_URL: sqlite:////tmp/recruitmatch-test.db
      TASK_MODE: inline
      AI_ENABLED: "false"
      OPENAI_API_KEY: ""
    command: >-
      pytest tests --ignore=tests/integration --ignore=tests/artifacts
      --ignore=tests/retrieval/test_citation_lifecycle.py
      --ignore=tests/retrieval/test_generation_switch.py
      --ignore=tests/retrieval/test_pgvector_search.py -q
    healthcheck:
      disable: true

  test-integration:
    image: ${COMPOSE_PROJECT_NAME:-recruitmatch}-app-test
    build: *test-build
    profiles: ["test"]
    environment:
      <<: *app-environment
      TASK_MODE: celery
      AI_ENABLED: "false"
      OPENAI_API_KEY: ""
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-test-setup:
        condition: service_completed_successfully
    command: pytest tests/integration tests/retrieval tests/artifacts -q
    healthcheck:
      disable: true

  minio-test-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: ["test"]
    entrypoint: ["/bin/sh", "/init/test-setup.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-recruitmatch-root-demo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-demo-root-password-change-me}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./ops/minio:/init:ro
    restart: "no"

volumes:
  minio-data:
  postgres-data:
  redis-data:
  hf-cache-v2:
