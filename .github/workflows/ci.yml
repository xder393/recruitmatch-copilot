name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv lock --check
      - run: uv run ruff check app tests scripts
      - run: uv run ruff format --check app tests scripts
      - run: uv run mypy app/models app/retrieval app/services app/ai app/tasks

  unit:
    runs-on: ubuntu-latest
    needs: validate
    env:
      DATABASE_URL: sqlite:////tmp/recruitmatch-ci.db
      ARTIFACT_DIR: /tmp/recruitmatch-resumes
      KNOWLEDGE_ARTIFACT_DIR: /tmp/recruitmatch-knowledge
      TASK_MODE: inline
      AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run python scripts/generate_recruitment_eval.py --output /tmp/recruitmatch-eval.json
      - run: >-
          uv run python scripts/evaluate_recruitment.py
          --dataset /tmp/recruitmatch-eval.json
          --output /tmp/recruitmatch-results.json
      - run: >-
          uv run python scripts/evaluate_ai_pipeline.py
          --dataset evaluation/recruitmatch-ai-v1.json
          --output /tmp/recruitmatch-ai-results.json
          --mode hybrid-v1 --fake-model
      - run: diff -u evaluation/recruitmatch-ai-v1-results.json /tmp/recruitmatch-ai-results.json
      - run: >-
          uv run pytest tests
          --ignore=tests/integration
          --ignore=tests/artifacts
          --ignore=tests/retrieval/test_citation_lifecycle.py
          --ignore=tests/retrieval/test_generation_switch.py
          --ignore=tests/retrieval/test_pgvector_search.py
          -q

  postgres-integration:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -p recruitmatch-ci-pgvector up -d postgres
      - run: docker compose -p recruitmatch-ci-pgvector build bootstrap test-integration
      - run: docker compose -p recruitmatch-ci-pgvector run --rm bootstrap
      - run: docker compose -p recruitmatch-ci-pgvector run --rm bootstrap
      - name: Run PostgreSQL integration and retrieval tests
        run: >-
          docker compose -p recruitmatch-ci-pgvector run --rm test-integration
          pytest tests/integration tests/retrieval tests/artifacts -q
      - if: always()
        run: docker compose -p recruitmatch-ci-pgvector down -v
