name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ruff check app tests scripts
      - run: DATABASE_URL=sqlite:////tmp/recruitmatch-ci.db alembic upgrade head
      - run: python scripts/generate_recruitment_eval.py --output /tmp/recruitmatch-eval.json
      - run: >-
          python scripts/evaluate_recruitment.py
          --dataset /tmp/recruitmatch-eval.json
          --output /tmp/recruitmatch-results.json
      - run: >-
          python scripts/evaluate_ai_pipeline.py
          --dataset evaluation/recruitmatch-ai-v1.json
          --output /tmp/recruitmatch-ai-results.json
          --mode hybrid-v1 --fake-model
      - run: diff -u evaluation/recruitmatch-ai-v1-results.json /tmp/recruitmatch-ai-results.json
      - run: python -m pytest -q
