# JSON is a YAML subset; explicit OTTL arrays avoid quoting ambiguities.
# Secondary defense: drop optional events, links and exemplars; preserve parentage.
{
  "receivers": {
    "otlp": {
      "protocols": {
        "grpc": {
          "endpoint": "0.0.0.0:4317"
        },
        "http": {
          "endpoint": "0.0.0.0:4318"
        }
      }
    }
  },
  "processors": {
    "memory_limiter": {
      "check_interval": "1s",
      "limit_mib": 192,
      "spike_limit_mib": 48
    },
    "filter/redaction": {
      "error_mode": "propagate",
      "trace_conditions": [
        {
          "context": "resource",
          "conditions": [
            "not ContainsValue([\"recruitmatch-api\", \"recruitmatch-worker\", \"recruitmatch-beat\"], resource.attributes[\"service.name\"]) or not ContainsValue([\"development\", \"test\", \"staging\", \"production\"], resource.attributes[\"deployment.environment.name\"]) or not IsString(resource.attributes[\"service.instance.id\"])",
            "not IsMatch(resource.attributes[\"service.instance.id\"], \"^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$\")"
          ]
        }
      ],
      "metric_conditions": [
        {
          "context": "resource",
          "conditions": [
            "not ContainsValue([\"recruitmatch-api\", \"recruitmatch-worker\", \"recruitmatch-beat\"], resource.attributes[\"service.name\"]) or not ContainsValue([\"development\", \"test\", \"staging\", \"production\"], resource.attributes[\"deployment.environment.name\"]) or not IsString(resource.attributes[\"service.instance.id\"])",
            "not IsMatch(resource.attributes[\"service.instance.id\"], \"^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$\")"
          ]
        },
        {
          "context": "metric",
          "conditions": [
            "not ContainsValue([\"recruitmatch.task.started\",\"recruitmatch.task.completed\",\"recruitmatch.task.failed\",\"recruitmatch.task.retry\",\"recruitmatch.task.duration\",\"recruitmatch.queue.depth\",\"recruitmatch.queue.oldest_age\",\"recruitmatch.lease.takeover\",\"recruitmatch.lease.renew_failure\",\"recruitmatch.worker.live\",\"recruitmatch.worker.oldest_heartbeat_age\",\"recruitmatch.beat.tick_age\",\"recruitmatch.artifact.operation\",\"recruitmatch.artifact.operation.duration\",\"recruitmatch.artifact.cleanup_pending\",\"recruitmatch.vector.search.duration\",\"recruitmatch.vector.search.results\",\"recruitmatch.vector.indexed_chunks\",\"recruitmatch.model.request\",\"recruitmatch.model.duration\",\"recruitmatch.model.tokens\",\"recruitmatch.model.fallback\",\"recruitmatch.model.schema_failure\",\"recruitmatch.citation.rejection\",\"recruitmatch.match.completed\",\"recruitmatch.match.duration\",\"recruitmatch.match.score\",\"http.server.request.duration\",\"http.client.request.duration\",\"http.server.active_requests\"], metric.name)"
          ]
        }
      ]
    },
    "transform/privacy": {
      "error_mode": "propagate",
      "trace_statements": [
        {
          "context": "span",
          "statements": [
            "keep_keys(resource.attributes, [\"service.name\", \"deployment.environment.name\", \"service.instance.id\"])",
            "set(resource.schema_url, \"\")",
            "set(instrumentation_scope.schema_url, \"\")",
            "set(instrumentation_scope.name, \"recruitmatch\")",
            "set(instrumentation_scope.version, \"0.2.0\")",
            "keep_keys(instrumentation_scope.attributes, [])",
            "keep_keys(span.attributes, [\"http.route\",\"http.request.method\",\"task.type\",\"source.type\",\"operation\",\"outcome\",\"error.code\",\"model.provider\",\"model.name\",\"match.mode\",\"retrieval.strategy\",\"recovery.reason\",\"http.response.status_code\"])",
            "delete_key(span.attributes, \"http.route\") where span.attributes[\"http.route\"] != nil and not ContainsValue([\"/\",\"/api/v1/ai/status\",\"/api/v1/analytics/summary\",\"/api/v1/auth/bootstrap\",\"/api/v1/auth/login\",\"/api/v1/auth/me\",\"/api/v1/evaluations/summary\",\"/api/v1/health/live\",\"/api/v1/health/ready\",\"/api/v1/health/system\",\"/api/v1/job-templates\",\"/api/v1/jobs\",\"/api/v1/jobs/{job_id}\",\"/api/v1/jobs/{job_id}/activate\",\"/api/v1/jobs/{job_id}/deactivate\",\"/api/v1/knowledge-documents\",\"/api/v1/knowledge-documents/rebuild-sources\",\"/api/v1/knowledge-documents/{document_id}\",\"/api/v1/knowledge-documents/{document_id}/deactivate\",\"/api/v1/knowledge-documents/{document_id}/reindex\",\"/api/v1/match-results/{result_id}/feedback\",\"/api/v1/match-runs/{run_id}\",\"/api/v1/resumes\",\"/api/v1/resumes/{resume_id}\",\"/api/v1/resumes/{resume_id}/matches\"], span.attributes[\"http.route\"])",
            "delete_key(span.attributes, \"http.request.method\") where span.attributes[\"http.request.method\"] != nil and not ContainsValue([\"GET\",\"POST\",\"PUT\",\"PATCH\",\"DELETE\",\"HEAD\",\"OPTIONS\",\"CONNECT\",\"TRACE\",\"_OTHER\"], span.attributes[\"http.request.method\"])",
            "delete_key(span.attributes, \"task.type\") where span.attributes[\"task.type\"] != nil and not ContainsValue([\"resume\",\"knowledge\",\"knowledge_document\",\"resume.process\",\"knowledge.process\",\"recovery\",\"cleanup\"], span.attributes[\"task.type\"])",
            "delete_key(span.attributes, \"source.type\") where span.attributes[\"source.type\"] != nil and not ContainsValue([\"resume\",\"knowledge\",\"knowledge_document\",\"job_version\"], span.attributes[\"source.type\"])",
            "delete_key(span.attributes, \"operation\") where span.attributes[\"operation\"] != nil and not ContainsValue([\"resume.upload\",\"artifact.put\",\"artifact.get\",\"artifact.delete\",\"resume.process\",\"knowledge.process\",\"resume.parse\",\"embedding.generate\",\"vector.index\",\"vector.search\",\"matching.run\",\"model.generate\",\"citation.validate\",\"lease.claim\",\"lease.renew\",\"lease.finalize\",\"beat.recover\",\"put\",\"get\",\"delete\",\"head\",\"list\",\"claim\",\"renew\",\"finalize\",\"semantic_project_match\",\"match_explanation\"], span.attributes[\"operation\"])",
            "delete_key(span.attributes, \"outcome\") where span.attributes[\"outcome\"] != nil and not ContainsValue([\"success\",\"failure\",\"error\",\"fallback\",\"retry\",\"deferred\",\"duplicate_active\",\"terminal\",\"lease_lost\",\"rejected\",\"skipped\",\"empty\",\"claimed\"], span.attributes[\"outcome\"])",
            "delete_key(span.attributes, \"error.code\") where span.attributes[\"error.code\"] != nil and not ContainsValue([\"internal_error\",\"model_timeout\",\"timeout\",\"authentication_failed\",\"rate_limited\",\"transport_error\",\"provider_unavailable\",\"provider_rejected\",\"provider_error\",\"invalid_output\",\"schema_failure\",\"storage_unavailable\",\"embedding_failed\",\"processing_timeout\",\"processing_attempts_exhausted\",\"processing_dispatch_unavailable\",\"task_dispatch_failed\",\"artifact_missing\",\"artifact_access_denied\",\"artifact_checksum_mismatch\",\"artifact_length_mismatch\",\"artifact_too_large\",\"artifact_storage_failure\",\"artifact_invalid_location\",\"artifact_error\",\"artifact_cleanup_pending\",\"lease_lost\",\"citation_rejected\",\"invalid_citation\",\"citation_not_found\",\"generation_inconsistent\",\"validation_error\",\"unsupported_file\",\"unauthorized\",\"forbidden\",\"not_found\",\"conflict\",\"object_not_found\",\"checksum_mismatch\",\"size_mismatch\",\"size_exceeded\",\"access_denied\",\"insufficient_evidence\",\"retrieval_unavailable\",\"unexpected_model_error\",\"empty_model_output\",\"resume_parsed_state_invalid\",\"resume_processing_failed\",\"knowledge_processing_failed\",\"validation_failed\",\"activation_failed\",\"source_unavailable\",\"document_resource_limit\",\"resume_extraction_failed\",\"resume_empty_text\"], span.attributes[\"error.code\"])",
            "delete_key(span.attributes, \"model.provider\") where span.attributes[\"model.provider\"] != nil and not ContainsValue([\"openai-compatible\",\"local\",\"bge\"], span.attributes[\"model.provider\"])",
            "delete_key(span.attributes, \"model.name\") where span.attributes[\"model.name\"] != nil and not ContainsValue([\"deepseek-chat\",\"BAAI/bge-small-zh-v1.5\"], span.attributes[\"model.name\"])",
            "delete_key(span.attributes, \"match.mode\") where span.attributes[\"match.mode\"] != nil and not ContainsValue([\"rules\",\"semantic\",\"hybrid\",\"rules_fallback\"], span.attributes[\"match.mode\"])",
            "delete_key(span.attributes, \"retrieval.strategy\") where span.attributes[\"retrieval.strategy\"] != nil and not ContainsValue([\"pgvector\",\"semantic\",\"hybrid\",\"cosine\",\"exact\"], span.attributes[\"retrieval.strategy\"])",
            "delete_key(span.attributes, \"recovery.reason\") where span.attributes[\"recovery.reason\"] != nil and not ContainsValue([\"queued_stale\",\"lease_expired\",\"retry_due\",\"cleanup_pending\",\"generation_inconsistent\"], span.attributes[\"recovery.reason\"])",
            "delete_key(span.attributes, \"http.response.status_code\") where span.attributes[\"http.response.status_code\"] != nil and not IsInt(span.attributes[\"http.response.status_code\"])",
            "delete_key(span.attributes, \"http.response.status_code\") where span.attributes[\"http.response.status_code\"] != nil and (span.attributes[\"http.response.status_code\"] < 100 or span.attributes[\"http.response.status_code\"] > 599)",
            "set(span.name, \"internal.operation\") where not ContainsValue([\"resume.upload\",\"artifact.put\",\"artifact.get\",\"artifact.delete\",\"resume.process\",\"knowledge.process\",\"resume.parse\",\"embedding.generate\",\"vector.index\",\"vector.search\",\"matching.run\",\"model.generate\",\"citation.validate\",\"lease.claim\",\"lease.renew\",\"lease.finalize\",\"beat.recover\",\"task.started\",\"task.completed\",\"task.failed\",\"task.retry\",\"task.duration\",\"queue.depth\",\"queue.oldest_age\",\"lease.takeover\",\"lease.renew_failure\",\"worker.live\",\"worker.oldest_heartbeat_age\",\"beat.tick_age\",\"artifact.operation\",\"artifact.operation.duration\",\"artifact.cleanup_pending\",\"vector.search.duration\",\"vector.search.results\",\"vector.indexed_chunks\",\"model.request\",\"model.duration\",\"model.tokens\",\"model.fallback\",\"model.schema_failure\",\"citation.rejection\",\"match.completed\",\"match.duration\",\"match.score\",\"matching.completed\",\"internal.operation\",\"GET\",\"POST\",\"PUT\",\"PATCH\",\"DELETE\",\"HEAD\",\"OPTIONS\",\"CONNECT\",\"TRACE\",\"_OTHER\"], span.name) and not (span.attributes[\"http.request.method\"] != nil and span.attributes[\"http.route\"] != nil and span.name == Concat([span.attributes[\"http.request.method\"], span.attributes[\"http.route\"]], \" \"))",
            "set(span.status.message, \"\")",
            "set(span.trace_state, \"\")",
            "set(span.events, nil)",
            "set(span.links, nil)"
          ]
        }
      ],
      "metric_statements": [
        {
          "context": "datapoint",
          "statements": [
            "keep_keys(resource.attributes, [\"service.name\", \"deployment.environment.name\", \"service.instance.id\"])",
            "set(resource.schema_url, \"\")",
            "set(instrumentation_scope.schema_url, \"\")",
            "set(instrumentation_scope.name, \"recruitmatch\")",
            "set(instrumentation_scope.version, \"0.2.0\")",
            "keep_keys(instrumentation_scope.attributes, [])",
            "keep_keys(datapoint.attributes, [\"http.route\",\"http.request.method\",\"task.type\",\"source.type\",\"operation\",\"outcome\",\"error.code\",\"model.provider\",\"model.name\",\"match.mode\",\"retrieval.strategy\",\"recovery.reason\",\"http.response.status_code\"])",
            "delete_key(datapoint.attributes, \"http.route\") where datapoint.attributes[\"http.route\"] != nil and not ContainsValue([\"/\",\"/api/v1/ai/status\",\"/api/v1/analytics/summary\",\"/api/v1/auth/bootstrap\",\"/api/v1/auth/login\",\"/api/v1/auth/me\",\"/api/v1/evaluations/summary\",\"/api/v1/health/live\",\"/api/v1/health/ready\",\"/api/v1/health/system\",\"/api/v1/job-templates\",\"/api/v1/jobs\",\"/api/v1/jobs/{job_id}\",\"/api/v1/jobs/{job_id}/activate\",\"/api/v1/jobs/{job_id}/deactivate\",\"/api/v1/knowledge-documents\",\"/api/v1/knowledge-documents/rebuild-sources\",\"/api/v1/knowledge-documents/{document_id}\",\"/api/v1/knowledge-documents/{document_id}/deactivate\",\"/api/v1/knowledge-documents/{document_id}/reindex\",\"/api/v1/match-results/{result_id}/feedback\",\"/api/v1/match-runs/{run_id}\",\"/api/v1/resumes\",\"/api/v1/resumes/{resume_id}\",\"/api/v1/resumes/{resume_id}/matches\"], datapoint.attributes[\"http.route\"])",
            "delete_key(datapoint.attributes, \"http.request.method\") where datapoint.attributes[\"http.request.method\"] != nil and not ContainsValue([\"GET\",\"POST\",\"PUT\",\"PATCH\",\"DELETE\",\"HEAD\",\"OPTIONS\",\"CONNECT\",\"TRACE\",\"_OTHER\"], datapoint.attributes[\"http.request.method\"])",
            "delete_key(datapoint.attributes, \"task.type\") where datapoint.attributes[\"task.type\"] != nil and not ContainsValue([\"resume\",\"knowledge\",\"knowledge_document\",\"resume.process\",\"knowledge.process\",\"recovery\",\"cleanup\"], datapoint.attributes[\"task.type\"])",
            "delete_key(datapoint.attributes, \"source.type\") where datapoint.attributes[\"source.type\"] != nil and not ContainsValue([\"resume\",\"knowledge\",\"knowledge_document\",\"job_version\"], datapoint.attributes[\"source.type\"])",
            "delete_key(datapoint.attributes, \"operation\") where datapoint.attributes[\"operation\"] != nil and not ContainsValue([\"resume.upload\",\"artifact.put\",\"artifact.get\",\"artifact.delete\",\"resume.process\",\"knowledge.process\",\"resume.parse\",\"embedding.generate\",\"vector.index\",\"vector.search\",\"matching.run\",\"model.generate\",\"citation.validate\",\"lease.claim\",\"lease.renew\",\"lease.finalize\",\"beat.recover\",\"put\",\"get\",\"delete\",\"head\",\"list\",\"claim\",\"renew\",\"finalize\",\"semantic_project_match\",\"match_explanation\"], datapoint.attributes[\"operation\"])",
            "delete_key(datapoint.attributes, \"outcome\") where datapoint.attributes[\"outcome\"] != nil and not ContainsValue([\"success\",\"failure\",\"error\",\"fallback\",\"retry\",\"deferred\",\"duplicate_active\",\"terminal\",\"lease_lost\",\"rejected\",\"skipped\",\"empty\",\"claimed\"], datapoint.attributes[\"outcome\"])",
            "delete_key(datapoint.attributes, \"error.code\") where datapoint.attributes[\"error.code\"] != nil and not ContainsValue([\"internal_error\",\"model_timeout\",\"timeout\",\"authentication_failed\",\"rate_limited\",\"transport_error\",\"provider_unavailable\",\"provider_rejected\",\"provider_error\",\"invalid_output\",\"schema_failure\",\"storage_unavailable\",\"embedding_failed\",\"processing_timeout\",\"processing_attempts_exhausted\",\"processing_dispatch_unavailable\",\"task_dispatch_failed\",\"artifact_missing\",\"artifact_access_denied\",\"artifact_checksum_mismatch\",\"artifact_length_mismatch\",\"artifact_too_large\",\"artifact_storage_failure\",\"artifact_invalid_location\",\"artifact_error\",\"artifact_cleanup_pending\",\"lease_lost\",\"citation_rejected\",\"invalid_citation\",\"citation_not_found\",\"generation_inconsistent\",\"validation_error\",\"unsupported_file\",\"unauthorized\",\"forbidden\",\"not_found\",\"conflict\",\"object_not_found\",\"checksum_mismatch\",\"size_mismatch\",\"size_exceeded\",\"access_denied\",\"insufficient_evidence\",\"retrieval_unavailable\",\"unexpected_model_error\",\"empty_model_output\",\"resume_parsed_state_invalid\",\"resume_processing_failed\",\"knowledge_processing_failed\",\"validation_failed\",\"activation_failed\",\"source_unavailable\",\"document_resource_limit\",\"resume_extraction_failed\",\"resume_empty_text\"], datapoint.attributes[\"error.code\"])",
            "delete_key(datapoint.attributes, \"model.provider\") where datapoint.attributes[\"model.provider\"] != nil and not ContainsValue([\"openai-compatible\",\"local\",\"bge\"], datapoint.attributes[\"model.provider\"])",
            "delete_key(datapoint.attributes, \"model.name\") where datapoint.attributes[\"model.name\"] != nil and not ContainsValue([\"deepseek-chat\",\"BAAI/bge-small-zh-v1.5\"], datapoint.attributes[\"model.name\"])",
            "delete_key(datapoint.attributes, \"match.mode\") where datapoint.attributes[\"match.mode\"] != nil and not ContainsValue([\"rules\",\"semantic\",\"hybrid\",\"rules_fallback\"], datapoint.attributes[\"match.mode\"])",
            "delete_key(datapoint.attributes, \"retrieval.strategy\") where datapoint.attributes[\"retrieval.strategy\"] != nil and not ContainsValue([\"pgvector\",\"semantic\",\"hybrid\",\"cosine\",\"exact\"], datapoint.attributes[\"retrieval.strategy\"])",
            "delete_key(datapoint.attributes, \"recovery.reason\") where datapoint.attributes[\"recovery.reason\"] != nil and not ContainsValue([\"queued_stale\",\"lease_expired\",\"retry_due\",\"cleanup_pending\",\"generation_inconsistent\"], datapoint.attributes[\"recovery.reason\"])",
            "delete_key(datapoint.attributes, \"http.response.status_code\") where datapoint.attributes[\"http.response.status_code\"] != nil and not IsInt(datapoint.attributes[\"http.response.status_code\"])",
            "delete_key(datapoint.attributes, \"http.response.status_code\") where datapoint.attributes[\"http.response.status_code\"] != nil and (datapoint.attributes[\"http.response.status_code\"] < 100 or datapoint.attributes[\"http.response.status_code\"] > 599)",
            "set(datapoint.exemplars, nil)",
            "set(metric.description, \"\")",
            "set(metric.unit, \"{task}\") where metric.name == \"recruitmatch.task.started\"",
            "set(metric.unit, \"{task}\") where metric.name == \"recruitmatch.task.completed\"",
            "set(metric.unit, \"{task}\") where metric.name == \"recruitmatch.task.failed\"",
            "set(metric.unit, \"{task}\") where metric.name == \"recruitmatch.task.retry\"",
            "set(metric.unit, \"s\") where metric.name == \"recruitmatch.task.duration\"",
            "set(metric.unit, \"{source}\") where metric.name == \"recruitmatch.queue.depth\"",
            "set(metric.unit, \"s\") where metric.name == \"recruitmatch.queue.oldest_age\"",
            "set(metric.unit, \"{takeover}\") where metric.name == \"recruitmatch.lease.takeover\"",
            "set(metric.unit, \"{failure}\") where metric.name == \"recruitmatch.lease.renew_failure\"",
            "set(metric.unit, \"{worker}\") where metric.name == \"recruitmatch.worker.live\"",
            "set(metric.unit, \"s\") where metric.name == \"recruitmatch.worker.oldest_heartbeat_age\"",
            "set(metric.unit, \"s\") where metric.name == \"recruitmatch.beat.tick_age\"",
            "set(metric.unit, \"{operation}\") where metric.name == \"recruitmatch.artifact.operation\"",
            "set(metric.unit, \"s\") where metric.name == \"recruitmatch.artifact.operation.duration\"",
            "set(metric.unit, \"{artifact}\") where metric.name == \"recruitmatch.artifact.cleanup_pending\"",
            "set(metric.unit, \"s\") where metric.name == \"recruitmatch.vector.search.duration\"",
            "set(metric.unit, \"{result}\") where metric.name == \"recruitmatch.vector.search.results\"",
            "set(metric.unit, \"{chunk}\") where metric.name == \"recruitmatch.vector.indexed_chunks\"",
            "set(metric.unit, \"{request}\") where metric.name == \"recruitmatch.model.request\"",
            "set(metric.unit, \"s\") where metric.name == \"recruitmatch.model.duration\"",
            "set(metric.unit, \"{token}\") where metric.name == \"recruitmatch.model.tokens\"",
            "set(metric.unit, \"{fallback}\") where metric.name == \"recruitmatch.model.fallback\"",
            "set(metric.unit, \"{failure}\") where metric.name == \"recruitmatch.model.schema_failure\"",
            "set(metric.unit, \"{rejection}\") where metric.name == \"recruitmatch.citation.rejection\"",
            "set(metric.unit, \"{match}\") where metric.name == \"recruitmatch.match.completed\"",
            "set(metric.unit, \"s\") where metric.name == \"recruitmatch.match.duration\"",
            "set(metric.unit, \"1\") where metric.name == \"recruitmatch.match.score\"",
            "set(metric.unit, \"s\") where metric.name == \"http.server.request.duration\"",
            "set(metric.unit, \"s\") where metric.name == \"http.client.request.duration\"",
            "set(metric.unit, \"{request}\") where metric.name == \"http.server.active_requests\""
          ]
        }
      ]
    },
    "batch": {
      "timeout": "1s",
      "send_batch_size": 256,
      "send_batch_max_size": 512
    }
  },
  "exporters": {
    "otlp_grpc/tempo": {
      "endpoint": "tempo:4317",
      "tls": {
        "insecure": true
      },
      "timeout": "2s",
      "sending_queue": {
        "enabled": true,
        "num_consumers": 2,
        "queue_size": 256,
        "wait_for_result": false,
        "block_on_overflow": false
      },
      "retry_on_failure": {
        "enabled": true,
        "initial_interval": "1s",
        "max_interval": "5s",
        "max_elapsed_time": "30s"
      }
    },
    "otlp_http/prometheus": {
      "metrics_endpoint": "http://prometheus:9090/api/v1/otlp/v1/metrics",
      "timeout": "2s",
      "sending_queue": {
        "enabled": true,
        "num_consumers": 2,
        "queue_size": 256,
        "wait_for_result": false,
        "block_on_overflow": false
      },
      "retry_on_failure": {
        "enabled": true,
        "initial_interval": "1s",
        "max_interval": "5s",
        "max_elapsed_time": "30s"
      }
    }
  },
  "extensions": {
    "health_check": {
      "endpoint": "0.0.0.0:13133"
    }
  },
  "service": {
    "extensions": [
      "health_check"
    ],
    "telemetry": {
      "logs": {
        "level": "error",
        "encoding": "json",
        "disable_stacktrace": true
      },
      "metrics": {
        "level": "detailed",
        "readers": [
          {
            "pull": {
              "exporter": {
                "prometheus": {
                  "host": "0.0.0.0",
                  "port": 8888
                }
              }
            }
          }
        ]
      }
    },
    "pipelines": {
      "traces": {
        "receivers": [
          "otlp"
        ],
        "processors": [
          "memory_limiter",
          "filter/redaction",
          "transform/privacy",
          "batch"
        ],
        "exporters": [
          "otlp_grpc/tempo"
        ]
      },
      "metrics": {
        "receivers": [
          "otlp"
        ],
        "processors": [
          "memory_limiter",
          "filter/redaction",
          "transform/privacy",
          "batch"
        ],
        "exporters": [
          "otlp_http/prometheus"
        ]
      }
    }
  }
}
